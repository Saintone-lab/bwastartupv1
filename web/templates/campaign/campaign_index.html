{{ define "content" }}

<div class="d-flex justify-content-between mb-4">
  <h2 class="mb-0">List Of Campaigns</h2>
  <a href="/campaigns/new" class="btn btn-primary">
    <i class="fa fa-plus"></i> New Campaign
  </a>
</div>

<div class="card mb-4">
  <div class="card-body">
    <table class="table mb-0">
      <thead class="thead-light">
        <tr>
          <th scope="col"></th>
          <th scope="col">Name</th>
          <th scope="col">Short Description</th>
          <th scope="col">Goal Amount</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        {{ range .campaigns }}
        <tr>
          <td>
            {{if .CampaignImages}}
            <img
              class="img-fluid img-thumbnail"
              src="/{{ (index .CampaignImages 0).FileName}}"
              width="60"
              alt="Photos Of Campaigns"
            />
            {{end}}
          </td>
          <td>{{ .Name }}</td>
          <td>{{ .ShortDescription }}</td>
          <td>{{ .GoalAmountInIDR }}</td>
          <td>
            <div class="d-flex align-items-center">
              <a href="campaigns/show/{{ .ID }}" class="mx-2"><i class="fa fa-search"></i></a>
              <a href="campaigns/edit/{{ .ID }}" class="mx-2"><i class="fa fa-edit"></i></a>
              <a href="campaigns/image/{{ .ID }}" class="mx-2"><i class="fa fa-camera"></i></a>
            </div>
          </td>
        </tr>
        {{ end }}
      </tbody>
    </table>
  </div>
</div>
{{end}}
