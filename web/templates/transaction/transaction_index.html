{{ define "content" }}

<div class="d-flex justify-content-between mb-4">
  <h2 class="mb-0">List Of Transactions</h2>
</div>

<div class="card mb-4">
  <div class="card-body">
    <table class="table mb-0">
      <thead class="thead-light">
        <tr>
          <th scope="col">Campaign Name</th>
          <th scope="col">Amount</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        {{ range .transactions }}
        <tr>
          <td>{{ .Campaign.Name }}</td>
          <td>{{ .AmountInIDR }}</td>
          <td>{{.Status}}</td>
        </tr>
        {{ end }}
      </tbody>
    </table>
  </div>
</div>
{{end}}
